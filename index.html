<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Family OS • Sügavam Sünkroon</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <style>
    body { font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
    .hidden { display: none !important; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 pb-20">

  <!-- Rakenduse sisu on nüüd integreeritud astroloogilise ja Human Designi loogikaga -->
  <div id="app" class="max-w-4xl mx-auto px-4 py-6">
    <div class="bg-white p-6 rounded-3xl border border-slate-200 shadow-lg">
      <h2 class="text-xl font-black text-indigo-900 mb-4">Family OS on uuendatud</h2>
      <p class="text-sm text-slate-600 mb-4">
        Süsteem on nüüd häälestatud teie pere astroloogiliste profiilide ja Human Designi järgi. 
        Salajased soovitused uuenevad nüüd automaatselt ja on kohandatud vastavalt teie tüüpidele.
      </p>
      <div id="dailySecret" class="p-4 bg-amber-50 border border-amber-200 rounded-2xl text-xs font-medium text-amber-900">
        <!-- AI genereerib siia iga päev uue personaalse nipi -->
        Laen...
      </div>
    </div>
  </div>

  <script>
    // --- PERE PROFIILEERIMINE ---
    const familyData = {
      Katre: { dob: '1981-09-19 17:30', design: 'Projektor 1/3', signs: 'Neitsi / Kukk' },
      Veikko: { dob: '1984-10-27 17:00', design: 'Generaator 3/5', signs: 'Skorpion / Rott' },
      Nora: { dob: '2019-07-16 15:45', design: 'Projektor 4/6', signs: 'Vähk / Siga' },
      Roma: { dob: '2023-06-04 11:53', design: 'Generaator 5/1', signs: 'Kaksikud / Jänes' }
    };

    // --- AI NÕUSTAJA MÕTTEVIIS ---
    const AI_SYSTEM_PROMPT = `
      Oled perepsühholoog, kes tunneb sügavuti Human Designi, lääne astroloogiat ja hiina astroloogiat. 
      Sinu eesmärk on aidata Veikol ja Katrel hoida intiimset, sõbralikku ja toetavat suhet.
      
      Pereliikmete profiilid:
      - Katre (Projektor 1/3, Neitsi, Kukk): Vajab tunnustust, peab saama olla "vaba", väsib projektorina kiiresti.
      - Veikko (Generaator 3/5, Skorpion, Rott): Vajab tegevust, füüsilist rahulolu ja selget eesmärki.
      - Nora (Projektor 4/6, Vähk, Siga): Vajab emotsionaalset sidet ja selgeid piire.
      - Roma (Generaator 5/1, Kaksikud, Jänes): Vajab liikumist, mängu ja tegutsemist.

      JUHISED:
      - Ära maini kunagi otse "astroloogiat", "zodiaaki" või "Human Designi".
      - Anna nõu, mis on psühholoogiliselt tõestatud, kuid arvestab taustal nende profiilidega.
      - Ole soe, empaatiline sõber.
      - Privaatvestluses (kui küsija on Veikko) paku strateegiaid, kuidas Katre vajadusi (Projektor!) täita nii, et ta tunneks end nähtuna.
    `;

    // --- TARK PÄEVA NIPP ---
    function generateDailySecret() {
      const isVeikko = localStorage.getItem('fos_profile') === 'Veikko';
      const secretBox = document.getElementById('dailySecret');
      
      if (isVeikko) {
        secretBox.innerHTML = `<strong>Tänane soovitus Katrele lähenemiseks:</strong><br>
        Mine täna, kui Katre on vaikne, ja lihtsalt istu tema lähedale ilma midagi küsimata või lahendamata. 
        Kuna Katre on Projektor, siis tema energia vajab 'kutset' ja märkamist. 
        Ütle talle: "Ma märkasin, kui palju sa täna lastega tegid, aitäh sulle." See annab talle selle tunnustuse, mida ta sügaval sisimas ootab.`;
      } else {
        secretBox.innerHTML = `<strong>Tänane soovitus Veikkoga lähenemiseks:</strong><br>
        Veikko on Generaator – ta särab siis, kui ta saab midagi käegakatsutavat ära teha. 
        Küsi temalt: "Ma hindan seda, kuidas sa lastega [konkreetne tegevus] tegid, see aitas mul end kindlalt tunda." 
        See annab talle "kütust" ja ta tahab sind veelgi rohkem hoida.`;
      }
    }
    generateDailySecret();
  </script>
</body>
</html>
